services:
  mariadb:
    image: mariadb:10.11
    container_name: rag-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "001106"
      MARIADB_DATABASE: ry-vue-320
      MARIADB_USER: ruoyi
      MARIADB_PASSWORD: "001106"
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - rag_mariadb_data_v4:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
      - ./rag_server/src/main/resources/sql:/rag_sql:ro

  redis:
    image: redis:7.2-alpine
    container_name: rag-redis
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rag_minio:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: rag-etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - rag_milvus:/var/lib/milvus

volumes:
  rag_mariadb_data_v4:
  rag_minio:
  rag_milvus:
