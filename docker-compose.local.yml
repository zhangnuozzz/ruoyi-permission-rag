# Isolated, fresh test environment. Does not reuse the historical rag_* volumes.
name: rag-local
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: "001106"
      MARIADB_DATABASE: ry-vue-320
      MARIADB_USER: ruoyi
      MARIADB_PASSWORD: "001106"
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:3307:3306"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mariadb:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
      - ./rag_server/src/main/resources/sql:/rag_sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: rag-local/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ../../.local-runtime/minio-build
      dockerfile: ../../vllm-project/RAGproject/docker/minio-local/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes: ["etcd:/etcd"]
  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    depends_on: [etcd, minio]
    volumes: ["milvus:/var/lib/milvus"]
volumes:
  mariadb:
  redis:
  minio:
  etcd:
  milvus:
